packages:
  - host
  - client
  - bundle

# Link workspace packages to each other (the bundle depends on the host and
# client halves); every other dependency resolves through the overrides below.
linkWorkspacePackages: true

# pnpm 10+ blocks dependency install scripts until reviewed here. esbuild
# ships a platform binary through its postinstall; the client build needs it.
allowBuilds:
  esbuild: true


# The DSH runtime closure these plugins join owns every shared @deepseek-ai
# package. Pinning them to a built deepseek-harness checkout keeps this
# standalone install self-contained without an npm release of the framework.
overrides:
  '@deepseek-ai/cordis': 'link:../deepseek-harness/vendor/cordis'
  '@deepseek-ai/cordis-plugin-loader': 'link:../deepseek-harness/vendor/loader'
  '@deepseek-ai/cordis-plugin-include': 'link:../deepseek-harness/vendor/include'
  '@deepseek-ai/dsh-invariants': 'link:../deepseek-harness/packages/runtime-diagnostics/invariants'
  '@deepseek-ai/dsh-session': 'link:../deepseek-harness/packages/core/session'
  '@deepseek-ai/dsh-llm': 'link:../deepseek-harness/packages/llm/llm'
  '@deepseek-ai/dsh-typert-protocol': 'link:../deepseek-harness/packages/typert/protocol'
  '@deepseek-ai/dsh-zoned-time': 'link:../deepseek-harness/packages/util/zoned-time'
  '@deepseek-ai/dsh-step-timing': 'link:../deepseek-harness/packages/util/step-timing'
  '@deepseek-ai/dsh-api-remotes': 'link:../deepseek-harness/packages/api/remotes'
  '@deepseek-ai/dsh-client-locale': 'link:../deepseek-harness/packages/client/locale'
  '@deepseek-ai/dsh-client-ui-layout': 'link:../deepseek-harness/packages/client/ui-layout'
  '@deepseek-ai/dsh-client-ui-renderer': 'link:../deepseek-harness/packages/client/ui-renderer'
  '@deepseek-ai/dsh-client-ui-primitives': 'link:../deepseek-harness/packages/client/ui-primitives'
  '@deepseek-ai/dsh-client-ui-slots': 'link:../deepseek-harness/packages/client/ui-slots'
